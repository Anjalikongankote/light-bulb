<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buld</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bulb-container">
        <div class="wire"></div>
        <div class="wire-connection"></div>
        <div class="s-top"></div>
        <div class="s-bottom"></div>
        <div class="s-back"></div>
        <div class="b-top "></div>
        <div class="b-bottom "></div>

    </div>
    <div class="switch-container">
        <div class="switch-cover">
            <div class="screw"></div>
            <div class="switch "></div>
            <div class="screw"></div>
        </div>
    </div>
</body>
    <script>
        let isOpen = false;
        let btn = document.querySelector(".switch");
        let bulbtop = document.querySelector(".b-top");
        let bulbbottom = document.querySelector(".b-bottom");
        btn.addEventListener("click", function () {
            if(isOpen){
                btn.classList.remove("on");
                bulbbottom.classList.remove("bulbon");
                bulbtop.classList.remove("bulbon");
            } else{
            btn.classList.add("on");
            bulbtop.classList.add("bulbon");
            bulbbottom.classList.add("bulbon");
            }
            isOpen=!isOpen
        })
    </script>

</html>
